[DISPLAY]
DISPLAY                 = qtvcp qtplasmac
POSITION_OFFSET         = RELATIVE
POSITION_FEEDBACK       = ACTUAL
MAX_FEED_OVERRIDE       = 2.0
MAX_SPINDLE_OVERRIDE	= 1
MIN_SPINDLE_OVERRIDE	= 0.5
DEFAULT_LINEAR_VELOCITY = 150
MIN_LINEAR_VELOCITY     = 1
MAX_LINEAR_VELOCITY     = 300
INCREMENTS              = 10, 1, .1, .01, .001
MDI_HISTORY_FILE        = metric_mdi_history.txt
MDI_COMMAND_TIMEOUT     = 15
TOOL_EDITOR             = tooledit x y
PROGRAM_PREFIX          = /home/cnc/linuxcnc/nc_files
INTRO_GRAPHIC           = linuxcnc.gif
INTRO_TIME              = 5
CYCLE_TIME				= 0.1
GEOMETRY				= xyz

[QTPLASMAC]
MODE					= 0  # uses arc voltage to calc both arc volt, and arc ok
DRO_POSITION			= top
LASER_TOUCHOFF			= X0.0 Y0.0				# offset for laser
CAMERA_TOUCHOFF         = X0.0 Y0.0
HIDE_RUN				= 0
HIDE_PAUSE				= 0
HIDE_ABORT				= 0


[HALUI]
MDI_COMMAND=G53 G0 X#<_ini[joint_0]home> Y#<_ini[joint_1]home> Z#<_ini[joint_3]home>
MDI_COMMAND=O<probe_test> call, Probe Test
#MDI_COMMAND=(debug,macro2)
#MDI_COMMAND=(debug,macro3)
#MDI_COMMAND=(debug,macro4)
#MDI_COMMAND=(debug,macro5)
#MDI_COMMAND=(debug,macro6)
#MDI_COMMAND=(debug,macro7)
#MDI_COMMAND=(debug,macro8)
#MDI_COMMAND=(debug,macro9)
#MDI_COMMAND=(debug,macro10)
#MDI_COMMAND=(debug,macro11)
#MDI_COMMAND=(debug,macro12)
#MDI_COMMAND=(debug,macro13)
#MDI_COMMAND=(debug,macro14)
#MDI_COMMAND=(debug,macro15)
#MDI_COMMAND=(debug,macro16)

[FILTER]
PROGRAM_EXTENSION       = .ngc,.nc,.tap,.gc
ngc                     = qtplasmac_gcode
nc                      = qtplasmac_gcode
tap                     = qtplasmac_gcode
gc                      = qtplasmac_gcode


[MESA]
VERSION = 2.1.8
BOARD = 7i95
BOARD_NAME = 7i95T 


[RS274NGC]
RS274NGC_STARTUP_CODE   = G21 G40 G49 G80 G90 G92.1 G94 M52P1 
RS274NGC_STARTUP_CODE   = G10 L20 P1 Z0
PARAMETER_FILE          = metric_parameters.txt
SUBROUTINE_PATH         = ./:../../nc_files
USER_M_PATH             = ./:/usr/share/doc/linuxcnc/examples/nc_files/plasmac/m_files:../../nc_files
ARC_TOLERANCE           = 0.01

[HAL]
TWOPASS                 = ON
HALFILE					= mesa.hal
HALFILE				    = pendant.hal
HALFILE                 = qtplasmac_comp.hal
HALUI                   = halui
POSTGUI_HALFILE         = custom_postgui.hal

[EMC]
VERSION                 = 1.1
MACHINE                 = qtplasmac-metric
DEBUG                   = 0

[EMCIO]
EMCIO                   = iov2
CYCLE_TIME              = 0.100
TOOL_TABLE              = metric_tool.tbl

[HM2]
DRIVER 					= hm2_eth
ADDRESS 				= 10.10.10.10

[TASK]
TASK                    = milltask
CYCLE_TIME              = 0.01

[EMCMOT]
EMCMOT                  = motmod
BASE_PERIOD             = 75000                 # not relevant for MESA board
 # remember to set the P in PID to match 1/servo_period
SERVO_PERIOD            = 2000000              

[KINS]
KINEMATICS              = trivkins coordinates=XYYZ 
JOINTS                  = 4

[TRAJ]
SPINDLES                = 3
COORDINATES             = XYYZ
LINEAR_UNITS            = mm
MAX_LINEAR_VELOCITY     = 280
MAX_LINEAR_ACCELERATION = 2800
DEFAULT_LINEAR_VELOCITY = 150
ANGULAR_UNITS           = degree

[AXIS_X]
MIN_LIMIT               = 0
MAX_LIMIT               = 540

MAX_VELOCITY            = 200.0
MAX_ACCELERATION        = 2000.0
OFFSET_AV_RATIO         = 0.5

[JOINT_0]
MAX_VELOCITY            = 200.0
MAX_ACCELERATION        = 2000.0
STEPGEN_MAX_VEL         = 250.0       # 25% on the max value
STEPGEN_MAX_ACC         = 2500.0      # 25% on the max value

TYPE                    = LINEAR
SCALE                   = 50.9296
DRIVE                   = Custom
STEP_INVERT             = False
DIR_INVERT              = False

DIRSETUP                = 5000
DIRHOLD                 = 5000
STEPLEN                 = 2000
STEPSPACE               = 8000

ENCODER_SCALE = 

FERROR                  = 0.5
MIN_FERROR              = 0.05
DEADBAND                = 0

P                       = 500       # 1/servo_thread_period
I                       = 0
D                       = 0

FF0 = 0
FF1 = 1
FF2 = 0
BIAS = 0
MAX_OUTPUT = 0
MAX_ERROR = 0

HOME 					=   0
HOME_OFFSET 			= -10
HOME_SEARCH_VEL 		= -100
HOME_LATCH_VEL 			=  10
HOME_FINAL_VEL 			=  10
HOME_IS_SHARED 			=   1
HOME_SEQUENCE 			=   0
HOME_IGNORE_LIMITS      = YES


